<h3 id="relativistic-fluids-and-quasinormal-modes">Relativistic fluids and quasinormal modes</h3>

<p>I will talk about the difficulty of incorporating viscous effects in relativistic fluids, and how studying quasinormal modes of black holes may help solve the problem.</p>
